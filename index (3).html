<title>Programação para Ciência da Computação</title>
<meta name="description" content="Algoritmos e programação em C e C++ do zero, para o primeiro semestre de Ciência da Computação. O código roda direto no navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #EBEEF4;
  --sheet: #F9FAFC;
  --ink: #151A26;
  --muted: #525B6F;
  --rule: #C8CEDB;
  --grid: rgba(40, 60, 120, .2);
  --grid-major: rgba(40, 60, 120, .2);
  --accent: #2F54EB;
  --accent-hover: #4467F2;
  --accent-ink: #FFFFFF;
  --link: #2546C7;
  --ok: #1F7544;
  --err: #B42318;
  --code-bg: #FCFDFB;
  --gutter: #8A9891;
  --scope: #0E1220;
  --scope-ink: #BCD0FF;
  --scope-dim: #6E7A9A;
  --scope-err: #FF9C8F;
  --hl-k: #9A3B12;
  --hl-t: #1B5A9C;
  --hl-s: #2E7537;
  --hl-n: #7B3FB5;
  --hl-c: #7D8A83;
  --hl-p: #9C5A00;
  --mec: #1A6C88;
  --ele: #2B7A4B;
  --tel: #983B8B;
  --sel: rgba(47, 84, 235, .22);
  --font-ui: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0F121A; --sheet: #151925; --ink: #E3E7F0; --muted: #98A1B6; --rule: #2A3043;
    --grid: rgba(150, 170, 230, .12); --grid-major: rgba(150, 170, 230, .12);
    --accent: #4F6EF7; --accent-hover: #6683FA; --accent-ink: #FFFFFF;
    --link: #9DB2FF; --ok: #5FD08E; --err: #FF8A7A; --code-bg: #121620; --gutter: #5C6479;
    --scope: #0A0D14; --scope-ink: #B9C8FF; --scope-dim: #6E7A9A; --hl-k: #F0A274; --hl-t: #9DB2FF; --hl-s: #9AD49F; --hl-n: #E0A6F0; --hl-c: #6B7489; --hl-p: #E6B65C;
    --mec: #6CC4DD; --ele: #6FD39A; --tel: #E08AD6; --sel: rgba(79, 110, 247, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0F121A; --sheet: #151925; --ink: #E3E7F0; --muted: #98A1B6; --rule: #2A3043;
  --grid: rgba(150, 170, 230, .12); --grid-major: rgba(150, 170, 230, .12);
  --accent: #4F6EF7; --accent-hover: #6683FA; --accent-ink: #FFFFFF;
  --link: #9DB2FF; --ok: #5FD08E; --err: #FF8A7A; --code-bg: #121620; --gutter: #5C6479;
  --scope: #0A0D14; --scope-ink: #B9C8FF; --scope-dim: #6E7A9A; --hl-k: #F0A274; --hl-t: #9DB2FF; --hl-s: #9AD49F; --hl-n: #E0A6F0; --hl-c: #6B7489; --hl-p: #E6B65C;
  --mec: #6CC4DD; --ele: #6FD39A; --tel: #E08AD6; --sel: rgba(79, 110, 247, .3);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--font-ui); font-size: 18px; line-height: 1.6; color: var(--ink);
  background-color: var(--paper);
  background-image: radial-gradient(circle, var(--grid) 1.1px, transparent 1.6px);
  background-size: 22px 22px;
  background-position: 11px 11px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
::selection { background: var(--sel); }
a { color: var(--link); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
img, svg { max-width: 100%; }
code { font-family: var(--font-code); font-size: .84em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: .08em .32em; border-radius: 3px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; z-index: 50; font-weight: 600; }
.skip:focus { left: 12px; }

/* barra superior */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px clamp(14px, 3vw, 28px);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: var(--font-head); font-weight: 700; font-size: 1.25rem; line-height: 1; letter-spacing: .01em; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.bar .spacer { flex: 1; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 4px; font: 500 .95rem var(--font-ui); cursor: pointer; }
.icon-btn:hover { border-color: var(--muted); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

/* layout */
main { display: block; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(14px, 3vw, 28px); }

/* HOME */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; padding: clamp(36px, 7vw, 88px) 0 clamp(40px, 6vw, 72px); }
.hero h1 { font-family: var(--font-head); font-weight: 800; font-size: clamp(2.9rem, 6.6vw, 5.9rem); line-height: .94; letter-spacing: -.012em; margin: 0; text-wrap: balance; }
.cota { display: flex; align-items: center; gap: 0; margin: 18px 0 26px; color: var(--muted); max-width: 640px; }
.cota .ext { width: 1px; height: 22px; background: currentColor; flex: none; }
.cota svg { width: 9px; height: 10px; flex: none; fill: currentColor; }
.cota .ln { flex: 1; height: 1px; background: currentColor; }
.cota .lbl { padding: 0 12px; font-style: italic; font-size: .95rem; white-space: nowrap; color: var(--ink); }
.hero .lead { font-size: 1.2rem; line-height: 1.55; max-width: 34em; margin: 0 0 28px; color: var(--ink); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 4px; font: 600 1.05rem var(--font-ui); text-decoration: none; cursor: pointer; border: 1px solid transparent; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 70%, #000); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: translateY(1px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.cta-row .sub { color: var(--muted); font-size: .98rem; }
.hero-run { position: relative; }
.hero-run .caption { font-size: .95rem; color: var(--muted); margin: 10px 2px 0; }

.section { padding: clamp(36px, 6vw, 64px) 0; border-top: 1px solid var(--rule); }
.section > h2, .h-sec { font-family: var(--font-head); font-weight: 700; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1; margin: 0 0 8px; }
.section .sec-lead { color: var(--muted); max-width: 40em; margin: 0 0 32px; }

.roadmap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); background: var(--sheet); }
.rm-col { padding: 22px 22px 26px; border-left: 1px solid var(--rule); }
.rm-col:first-child { border-left: 0; }
.rm-col h3 { font-family: var(--font-head); font-weight: 700; font-size: 1.45rem; margin: 0 0 14px; line-height: 1.1; }
.rm-list { list-style: none; margin: 0; padding: 0; }
.rm-list li + li { border-top: 1px dashed var(--rule); }
.rm-list a { display: grid; grid-template-columns: 2.1em 1fr auto; gap: 4px; align-items: baseline; padding: 9px 0; color: var(--ink); text-decoration: none; }
.rm-list a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.rm-list .n { font-family: var(--font-head); font-weight: 700; font-size: 1.15rem; color: var(--muted); }
.rm-list .t { font-weight: 500; line-height: 1.3; }
.rm-list .m { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.rm-list .done .n { color: var(--ok); }
.check { display: inline-block; width: 1em; height: 1em; vertical-align: -.12em; }

.tracks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 3vw, 40px); }
.track { border-top: 4px solid var(--c); padding-top: 14px; }
.track h3 { font-family: var(--font-head); font-weight: 700; font-size: 1.6rem; margin: 0 0 6px; color: var(--c); }
.track p { margin: 0; }
.track.mec, .track.alg { --c: var(--mec); } .track.ele, .track.mat { --c: var(--ele); } .track.tel, .track.sis { --c: var(--tel); }
.arr { margin: 20px 0 26px; max-width: 640px; }
.arr-cells { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border: 1.5px solid var(--ink); }
.arr-cells span { height: 30px; border-left: 1px solid var(--rule); background: var(--sheet); }
.arr-cells span:first-child { border-left: 0; }
.arr-cells span.on { background: var(--accent); }
.arr-idx { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); font-family: var(--font-code); font-size: .7rem; color: var(--muted); text-align: center; margin-top: 3px; }
.arr-cap { font-family: var(--font-code); font-size: .88rem; margin-top: 8px; color: var(--ink); }
.arr-cap .hl-c { font-style: italic; }

.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 56px); }
.about p { margin: 0 0 14px; max-width: 36em; }
.foot { border-top: 1px solid var(--rule); padding: 28px 0 40px; color: var(--muted); font-size: .95rem; }
.foot p { margin: 4px 0; }

/* LIÇÃO */
.lesson-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); max-width: 1240px; margin: 0 auto; padding: 28px clamp(14px, 3vw, 28px) 64px; align-items: start; }
.sidebar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow: auto; padding-right: 4px; }
.sb-mod { margin-bottom: 18px; }
.sb-mod h4 { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; margin: 0 0 4px; color: var(--muted); letter-spacing: .01em; }
.sb-list { list-style: none; margin: 0; padding: 0; }
.sb-list a { display: grid; grid-template-columns: 1.7em 1fr auto; gap: 2px; padding: 6px 8px; border-radius: 3px; color: var(--ink); text-decoration: none; font-size: .97rem; line-height: 1.3; border-left: 3px solid transparent; }
.sb-list a:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.sb-list a[aria-current="page"] { background: var(--sheet); border-left-color: var(--accent); font-weight: 600; }
.sb-list .n { color: var(--muted); font-family: var(--font-head); font-weight: 700; }
.sb-list .ck { color: var(--ok); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: clamp(22px, 4vw, 52px) clamp(18px, 4.5vw, 60px) clamp(28px, 4vw, 48px); min-width: 0; }
.prose { max-width: 44rem; }
.l-num { color: var(--muted); font-size: 1rem; margin: 0 0 6px; }
.sheet h1 { font-family: var(--font-head); font-weight: 800; font-size: clamp(2.4rem, 5.4vw, 3.8rem); line-height: .95; margin: 0 0 16px; letter-spacing: -.01em; text-wrap: balance; }
.l-lead { font-size: 1.18rem; color: var(--muted); margin: 0 0 30px; max-width: 40em; }
.prose h2 { font-family: var(--font-head); font-weight: 700; font-size: 1.85rem; line-height: 1.1; margin: 2.2em 0 .5em; }
.prose p, .prose dl, .prose ul { margin: 0 0 1.05em; }
.prose strong { font-weight: 600; }
pre.static { font-family: var(--font-code); font-size: .86rem; line-height: 1.6; background: var(--code-bg); border: 1px solid var(--rule); border-left: 3px solid var(--rule); padding: 14px 18px; overflow-x: auto; margin: 0 0 1.2em; max-width: 100%; }
.note { border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); padding: 14px 18px; margin: 1.4em 0; }
.note b { display: block; margin-bottom: 2px; }
.ipo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 0 1.4em; border: 1px solid var(--rule); }
.ipo > div { padding: 12px 16px; border-left: 1px solid var(--rule); position: relative; }
.ipo > div:first-child { border-left: 0; }
.ipo > div + div::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: var(--sheet); border-top: 1px solid var(--rule); border-right: 1px solid var(--rule); transform: translateY(-50%) rotate(45deg); }
.ipo b { display: block; font-family: var(--font-head); font-size: 1.25rem; }
.ipo span { font-size: .95rem; color: var(--muted); line-height: 1.4; display: block; }
dl.anatomy { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; }
dl.anatomy dt { font-weight: 500; }
dl.anatomy dd { margin: 0; }
.table-wrap { overflow-x: auto; margin: 0 0 1.3em; }
table { border-collapse: collapse; width: 100%; font-size: .97rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; border-bottom-width: 2px; }

.l-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 40px 0 0; padding-top: 22px; border-top: 1px solid var(--rule); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 9px 16px; border-radius: 4px; font: 500 .98rem var(--font-ui); cursor: pointer; }
.btn-ghost:hover { border-color: var(--muted); }
.btn-ghost[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
.pager a { display: block; padding: 14px 18px; border: 1px solid var(--rule); text-decoration: none; color: var(--ink); background: var(--paper); }
.pager a:hover { border-color: var(--muted); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: .88rem; }
.pager span { font-family: var(--font-head); font-weight: 700; font-size: 1.25rem; line-height: 1.15; }

/* TAGS */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--c, var(--muted)); white-space: nowrap; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tag.mec, .tag.alg { --c: var(--mec); } .tag.ele, .tag.mat { --c: var(--ele); } .tag.tel, .tag.sis { --c: var(--tel); }

/* RUNNER */
.runner { border: 1px solid var(--rule); background: var(--code-bg); margin: 1.4em 0 1.8em; max-width: 100%; box-shadow: 0 1px 0 var(--rule); }
.prose .runner { max-width: min(100%, 52rem); }
.rn-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 55%, var(--code-bg)); }
.rn-file { font-family: var(--font-code); font-size: .82rem; color: var(--muted); }
.rn-head .spacer { flex: 1; }
.rn-kbd { font-size: .8rem; color: var(--muted); }
.btn-run, .btn-check { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 4px; font: 600 .95rem var(--font-ui); cursor: pointer; }
.btn-run { background: var(--accent); color: var(--accent-ink); border: 1px solid color-mix(in srgb, var(--accent) 70%, #000); }
.btn-run:hover { background: var(--accent-hover); }
.btn-run svg { width: 12px; height: 12px; }
.btn-check { background: var(--ink); color: var(--sheet); border: 1px solid var(--ink); }
.btn-check:hover { opacity: .88; }
.btn-sm { padding: 6px 12px; font-size: .9rem; }
.btn-run[disabled], .btn-check[disabled] { opacity: .6; cursor: progress; }

.ed { display: grid; grid-template-columns: auto minmax(0, 1fr); font-family: var(--font-code); font-size: 14.5px; line-height: 1.6; }
.ed-gutter { margin: 0; padding: 12px 10px 12px 12px; text-align: right; color: var(--gutter); user-select: none; border-right: 1px solid var(--rule); min-width: 3em; font: inherit; }
.ed-gutter span { display: block; }
.ed-gutter span.bad { color: var(--err); font-weight: 600; background: color-mix(in srgb, var(--err) 14%, transparent); margin: 0 -10px 0 -12px; padding: 0 10px 0 12px; }
.ed-area { position: relative; overflow: hidden; }
.ed-area pre, .ed-area textarea { margin: 0; padding: 12px 14px; font: inherit; line-height: inherit; white-space: pre; tab-size: 4; letter-spacing: 0; word-spacing: 0; }
.ed-area pre { position: absolute; inset: 0; pointer-events: none; color: var(--ink); overflow: hidden; }
.ed-area textarea { position: relative; display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--ink); overflow-x: auto; overflow-y: hidden; }
.ed-area textarea::selection { background: var(--sel); color: transparent; }
.ed:focus-within { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 65%, transparent); }
.hl-k { color: var(--hl-k); font-weight: 600; } .hl-t { color: var(--hl-t); } .hl-s { color: var(--hl-s); } .hl-n { color: var(--hl-n); } .hl-c { color: var(--hl-c); font-style: italic; } .hl-p { color: var(--hl-p); }

.rn-in { border-top: 1px solid var(--rule); padding: 10px 14px 12px; background: color-mix(in srgb, var(--paper) 40%, var(--code-bg)); }
.rn-in label { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
.rn-in label small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.rn-in textarea { width: 100%; min-height: 2.6em; resize: vertical; font: 14px/1.5 var(--font-code); padding: 7px 10px; border: 1px solid var(--rule); background: var(--code-bg); color: var(--ink); border-radius: 3px; }
.rn-out { background: var(--scope); color: var(--scope-ink); padding: 10px 14px 14px; font-family: var(--font-code); font-size: 14px; line-height: 1.55; min-height: 64px; }
.rn-out-head { display: flex; justify-content: space-between; font-family: var(--font-ui); font-size: .82rem; color: var(--scope-dim); margin-bottom: 4px; }
.console { margin: 0; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.console .dim { color: var(--scope-dim); }
.console .errbox { display: block; color: var(--scope-err); margin-top: 6px; white-space: normal; font-family: var(--font-ui); font-size: .98rem; line-height: 1.45; }
.console .errbox b { display: block; }
.console .errbox span { color: #E7CFC9; }
.console .warnbox { display: block; color: #F5D27A; margin-top: 6px; white-space: normal; font-family: var(--font-ui); font-size: .98rem; }

/* EXERCÍCIO */
.exercise { margin: 2.6em 0 0; padding: 22px clamp(16px, 3vw, 26px) 24px; border: 2px solid color-mix(in srgb, var(--ink) 72%, var(--paper)); background: var(--paper); position: relative; }
.exercise .ex-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; }
.exercise h2 { margin: 0 !important; font-family: var(--font-head); font-size: 1.85rem; }
.exercise .runner { background: var(--code-bg); margin-bottom: 0; }
.expect { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 0; border: 1px solid var(--rule); margin: 16px 0 6px; background: var(--code-bg); }
.expect > div { padding: 10px 14px; min-width: 0; }
.expect > div + div { border-left: 1px solid var(--rule); }
.expect .lbl { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.expect pre { margin: 0; font: 13.5px/1.5 var(--font-code); white-space: pre; overflow-x: auto; }
.results { margin-top: 14px; }
.results:empty { display: none; }
.res-item { border: 1px solid var(--rule); background: var(--sheet); padding: 10px 14px; margin-top: 8px; }
.res-item.pass { border-left: 4px solid var(--ok); }
.res-item.fail { border-left: 4px solid var(--err); }
.res-item b.st-ok { color: var(--ok); } .res-item b.st-bad { color: var(--err); }
.res-cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 8px; }
.res-cmp .lbl { font-size: .82rem; color: var(--muted); }
.res-cmp pre { margin: 0; font: 13px/1.5 var(--font-code); background: var(--code-bg); border: 1px solid var(--rule); padding: 8px 10px; overflow-x: auto; white-space: pre; }
.res-cmp mark { background: color-mix(in srgb, var(--err) 22%, transparent); color: inherit; }
.res-all { margin-top: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); font-weight: 600; }
details.solution { margin-top: 16px; }
details.solution summary { cursor: pointer; font-weight: 600; color: var(--link); }
details.solution pre { font: 13.5px/1.6 var(--font-code); background: var(--code-bg); border: 1px solid var(--rule); padding: 12px 16px; overflow-x: auto; margin: 10px 0 0; }
.ex-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }

/* Responsivo */
@media (max-width: 1000px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .roadmap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rm-col:nth-child(3) { border-left: 0; }
  .rm-col:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 860px) {
  .lesson-layout { grid-template-columns: minmax(0, 1fr); padding-top: 14px; }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); max-height: none; background: var(--paper); border-right: 1px solid var(--rule); padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-102%); transition: transform .22s ease; }
  .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  .sidebar .sb-close { display: inline-flex !important; margin-bottom: 12px; }
  .tracks, .about { grid-template-columns: minmax(0, 1fr); }
  .ipo { grid-template-columns: minmax(0, 1fr); }
  .ipo > div { border-left: 0; border-top: 1px solid var(--rule); }
  .ipo > div:first-child { border-top: 0; }
  .ipo > div + div::before { left: 50%; top: -7px; transform: translateX(-50%) rotate(135deg); }
  dl.anatomy { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  dl.anatomy dd { margin-bottom: 10px; }
}
@media (max-width: 600px) {
  body { font-size: 17px; }
  .roadmap { grid-template-columns: minmax(0, 1fr); }
  .rm-col { border-left: 0; }
  .rm-col + .rm-col { border-top: 1px solid var(--rule); }
  .expect, .res-cmp { grid-template-columns: minmax(0, 1fr); }
  .expect > div + div { border-left: 0; border-top: 1px solid var(--rule); }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager a.next { grid-column: 1; }
  .rn-kbd { display: none; }
  .ed { font-size: 13.5px; }
  .brand-text { font-size: 1.05rem; line-height: 1.05; max-width: 11em; }
  #barLessons { display: none; }
  .lesson-layout { padding-left: 8px; padding-right: 8px; }
  .sheet { padding: 22px 14px 28px; }
  .exercise { padding: 18px 12px 20px; }
  .rn-head { padding: 8px 10px; }
  .ed-gutter { min-width: 2.4em; padding-left: 8px; padding-right: 8px; }
  .cota .lbl { white-space: normal; text-align: center; }
}
.sb-close { display: none !important; }
.copy-warn { background: #B42318; color: #fff; padding: 12px clamp(14px, 3vw, 28px); font-weight: 600; text-align: center; line-height: 1.4; }
.copy-warn a { color: #fff; text-decoration: underline; }
.credit { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .92rem; line-height: 1.5; }
.credit p { margin: 2px 0; }
.credit strong { color: var(--ink); font-weight: 600; }
/* EDITOR LIVRE */
.btn-secondary { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn-secondary:hover { border-color: var(--muted); }
.sb-editor { display: block; margin-top: 8px; padding: 10px 10px; border: 1px dashed var(--rule); color: var(--link); text-decoration: none; font-size: .95rem; line-height: 1.3; }
.sb-editor:hover { border-color: var(--link); }
.pg-wrap { padding-top: 28px; padding-bottom: 64px; }
.pg-head h1 { font-family: var(--font-head); font-weight: 800; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; margin: 0 0 8px; }
.pg-head p { margin: 0 0 24px; color: var(--muted); max-width: 46em; }
.pg-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
.pg-list { list-style: none; margin: 0 0 12px; padding: 0; border: 1px solid var(--rule); background: var(--sheet); }
.pg-list li + li { border-top: 1px solid var(--rule); }
.pg-file { display: block; width: 100%; text-align: left; padding: 9px 12px; background: transparent; border: 0; border-left: 3px solid transparent; color: var(--ink); font: 14px var(--font-code); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-file:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.pg-file.on { border-left-color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 8%, transparent); }
.pg-new { display: flex; flex-direction: column; gap: 8px; }
.pg-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.pg-bar label { font-weight: 600; font-size: .95rem; }
.pg-bar input { font: 14px/1.6 var(--font-code); padding: 7px 10px; border: 1px solid var(--rule); background: var(--code-bg); color: var(--ink); border-radius: 3px; width: min(260px, 100%); }
.pg-bar .spacer { flex: 1; }
.pg-main .runner { margin-top: 0; }
.pg-status { min-height: 1.4em; margin: 6px 0 0; color: var(--ok); font-size: .95rem; }
.btn-ghost.danger { border-color: var(--err); color: var(--err); }
@media (max-width: 860px) {
  .pg-layout { grid-template-columns: minmax(0, 1fr); }
  .pg-list { display: flex; flex-wrap: wrap; border: 0; background: none; gap: 6px; }
  .pg-list li + li { border-top: 0; }
  .pg-file { border: 1px solid var(--rule); background: var(--sheet); width: auto; }
  .pg-file.on { border-color: var(--accent); }
  .pg-new { flex-direction: row; flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  html: `
<p>Um <strong>algoritmo</strong> é uma sequência finita de instruções bem definidas que, a partir de uma entrada, produz uma saída e termina. Donald Knuth, em <em>The Art of Computer Programming</em>, lista cinco propriedades que todo algoritmo precisa ter:</p>
<div class="table-wrap"><table>
<thead><tr><th>Propriedade</th><th>Significa</th></tr></thead>
<tbody>
<tr><td>Finitude</td><td>termina depois de um número finito de passos</td></tr>
<tr><td>Definição</td><td>cada passo é preciso, sem ambiguidade</td></tr>
<tr><td>Entrada</td><td>zero ou mais valores recebidos antes de começar</td></tr>

<p>Juntos, <code>/</code> e <code>%</code> resolvem muitos problemas: um número é par se <code>n % 2 == 0</code>; o último dígito de <code>n</code> é <code>n % 10</code> e o resto do número é <code>n / 10</code>.</p>

<h2>Atribuição composta e incremento</h2>
<pre class="static">x += 5;    // x = x + 5

++i;       // soma 1, depois usa i  (pré-incremento)</pre>
<p>A diferença entre <code>i++</code> e <code>++i</code> só aparece quando o valor é usado na mesma expressão: <code>a = i++</code> guarda o valor antigo, <code>a = ++i</code> guarda o novo. Evite misturar isso com outras operações na mesma linha.</p>
<h2>Operadores lógicos</h2>
<p><code>&amp;&amp;</code> (e), <code>||</code> (ou) e <code>!</code> (não). Em C não existe tipo booleano nativo nas versões clássicas: 0 é falso e qualquer outro valor é verdadeiro. E há <em>curto-circuito</em>: em <code>a &amp;&amp; b</code>, se <code>a</code> for falso, <code>b</code> nem é avaliado.</p>

<p>Trabalham sobre os bits do número: <code>&amp;</code> (E), <code>|</code> (OU), <code>^</code> (OU exclusivo), <code>~</code> (negação), <code>&lt;&lt;</code> e <code>&gt;&gt;</code> (deslocamento). Deslocar 1 bit à esquerda multiplica por 2; à direita, divide por 2. São usados em sistemas operacionais, redes, compressão e criptografia, para guardar vários “sinais” num só inteiro.</p>

<h2>Busca linear e busca binária</h2>
<p>A busca linear olha um elemento por vez: no pior caso, <em>n</em> comparações. Se o vetor estiver <strong>ordenado</strong>, a busca binária compara com o meio e descarta metade a cada passo, gastando cerca de log₂ <em>n</em> comparações. Para um milhão de elementos, são 20 em vez de um milhão.</p>
<div data-run="binaria"></div>
<p>Experimente procurar 0, 1999 e um número ímpar (que não está no vetor).</p>
<h2>Ordenação</h2>
<p>O <strong>Bubble Sort</strong> compara vizinhos e troca os que estão fora de ordem; a cada passada, o maior elemento “borbulha” para o fim. O <strong>Selection Sort</strong> procura o menor elemento e o coloca na primeira posição, depois o segundo menor, e assim por diante. Os dois fazem cerca de <em>n</em>²/2 comparações.</p>
<div data-run="ordenacao"></div>

    else if (m[6]) cls = KW.test(t) ? 'k' : (TY.test(t) ? 't' : null);
    out += cls ? '<span class="hl-' + cls + '">' + esc(t) + '</span>' : esc(t);
    last = m.index + t.length;
    if (t.length === 0) TOK.lastIndex++;
  }
  out += esc(src.slice(last));
  return out;
}

/* ---------- editor ---------- */
function createEditor(code, onRun, label){
  var wrap = h('div', { 'class': 'ed' });
  var gutter = h('div', { 'class': 'ed-gutter', 'aria-hidden': 'true' });
  var area = h('div', { 'class': 'ed-area' });
  var pre = h('pre', { 'aria-hidden': 'true' });
  var ta = h('textarea', { spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', wrap: 'off', 'aria-label': label || 'Editor de código' });
  ta.value = code;
  area.appendChild(pre); area.appendChild(ta);
  wrap.appendChild(gutter); wrap.appendChild(area);
  var bad = 0;
  function render(){
    var v = ta.value;
    pre.innerHTML = highlight(v) + '\n';
    var n = v.split('\n').length, g = '';
    for (var i = 1; i <= n; i++) g += '<span' + (i === bad ? ' class="bad"' : '') + '>' + i + '</span>';
    gutter.innerHTML = g;
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight) + 'px';
    pre.style.transform = 'translateX(' + (-ta.scrollLeft) + 'px)';
  }
  ta.addEventListener('input', function(){ bad = 0; render(); if (api.onChange) api.onChange(); });
  ta.addEventListener('scroll', function(){ pre.style.transform = 'translateX(' + (-ta.scrollLeft) + 'px)'; });
  ta.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun && onRun(); return; }
    var s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if (e.key === 'Tab' && !e.shiftKey && !e.altKey) {
      if (s === en) { e.preventDefault(); insert('    '); }
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && s === en) {
      var ls = v.lastIndexOf('\n', s - 1) + 1;
      var line = v.slice(ls, s);
      var ind = (line.match(/^[ \t]*/) || [''])[0];
      if (/\{\s*$/.test(line)) ind += '    ';
      e.preventDefault(); insert('\n' + ind);
      return;
    }
    if (e.key === '}' && s === en) {
      var ls2 = v.lastIndexOf('\n', s - 1) + 1;
      var before = v.slice(ls2, s);
      if (/^ {4,}$/.test(before)) { e.preventDefault(); ta.setSelectionRange(s - 4, s); insert('}'); }
    }
  });
  function insert(text){
    // execCommand mantém o desfazer (Ctrl+Z) do navegador quando disponível
    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) {}
    if (!ok) { ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  }
  var api = {
    el: wrap,
    get value(){ return ta.value; },
    set value(v){ ta.value = v; bad = 0; render(); },
    mark: function(n){ bad = n || 0; render(); },
    focus: function(){ ta.focus(); },
    onChange: null,
    refresh: render
  };
  render();
  return api;
}

/* ---------- executor ---------- */
function usesInput(code){ return /\bscanf\s*\(|\bcin\s*>>/.test(code); }
function createRunner(opts){
  // opts: code, input, file, tag, key (para salvar), verify (testes), onPass
  var saved = opts.key ? store.get('code:' + opts.key, null) : null;
  var savedIn = opts.key ? store.get('in:' + opts.key, null) : null;
  var root = h('section', { 'class': 'runner', 'aria-label': 'Programa ' + (opts.file || '') });
  var head = h('div', { 'class': 'rn-head' });
  head.innerHTML = '<span class="rn-file">' + esc(opts.file || 'main.c') + '</span>' + tagHTML(opts.tag) +
    '<span class="spacer"></span><span class="rn-kbd">' + RUN_KEY + '</span>';
  var resetBtn = h('button', { 'class': 'btn-ghost btn-sm', type: 'button' }, 'Restaurar');
  var runBtn = h('button', { 'class': 'btn-run', type: 'button' }, PLAY + 'Executar');
  if (opts.toEditor) {
    var toEd = h('button', { 'class': 'btn-ghost btn-sm', type: 'button', title: 'Copia este código para o editor livre' }, 'Abrir no editor livre');
    toEd.addEventListener('click', function(){ newPgFile(opts.file || 'main.c', ed.value, inTa.value); location.hash = '#/editor'; });
    head.appendChild(toEd);
  }
  if (!opts.noReset) head.appendChild(resetBtn);
  head.appendChild(runBtn);
  var ed = createEditor(saved != null ? saved : opts.code, function(){ run(); }, 'Código de ' + (opts.file || 'main.c'));
  var inBox = h('div', { 'class': 'rn-in' });
  var inId = 'in-' + Math.random().toString(36).slice(2, 8);
  inBox.innerHTML = '<label for="' + inId + '">Entrada <small>os valores que o programa lê com scanf ou cin, separados por espaço ou linha</small></label>';
  var inTa = h('textarea', { id: inId, rows: '2', spellcheck: 'false' });
  inTa.value = savedIn != null ? savedIn : (opts.input || '');
  inBox.appendChild(inTa);
  var out = h('div', { 'class': 'rn-out', 'aria-live': 'polite' });
  out.innerHTML = '<div class="rn-out-head"><span>Saída</span><span class="ms"></span></div>';
  var con = h('pre', { 'class': 'console' });
  con.innerHTML = '<span class="dim">Clique em Executar ou pressione ' + RUN_KEY + '.</span>';
  out.appendChild(con);
  root.appendChild(head); root.appendChild(ed.el); root.appendChild(inBox); root.appendChild(out);

  function syncInputVisibility(){ inBox.hidden = !(usesInput(ed.value) || inTa.value.trim()); }
  syncInputVisibility();
  var tmr;
  ed.onChange = function(){
    clearTimeout(tmr);
    tmr = setTimeout(function(){ syncInputVisibility(); if (opts.key) store.set('code:' + opts.key, ed.value); }, 300);
  };
  inTa.addEventListener('input', function(){ if (opts.key) store.set('in:' + opts.key, inTa.value); });
  resetBtn.addEventListener('click', function(){
    ed.value = opts.code; inTa.value = opts.input || '';
    if (opts.key) { store.del('code:' + opts.key); store.del('in:' + opts.key); }
    syncInputVisibility();
    con.innerHTML = '<span class="dim">Código restaurado.</span>';
    out.querySelector('.ms').textContent = '';
  });
  runBtn.addEventListener('click', function(){ run(); });

  function showResult(r){
    var html = esc(r.out);
    if (!r.out && r.ok) html = '<span class="dim">(o programa não imprimiu nada)</span>';
    (r.notes || []).forEach(function(n){ html += '<span class="warnbox">' + esc(n) + '</span>'; });
    if (!r.ok) {
      html += '<span class="errbox"><b>' + esc(r.err.title) + '</b><span>' + esc(r.err.hint) + '</span></span>';
      if (r.err.line) ed.mark(r.err.line);
    } else if (r.warn) {
      html += '<span class="warnbox"><b>' + esc(r.warn.title) + '.</b> ' + esc(r.warn.hint) + '</span>';
    }
    con.innerHTML = html;
    out.querySelector('.ms').textContent = r.ok ? ('terminou em ' + r.ms + ' ms') : 'erro';
  }
  function run(){
    runBtn.disabled = true;
    con.innerHTML = '<span class="dim">Executando…</span>';
    ed.mark(0);
    setTimeout(function(){
      var r = window.CRun.run(ed.value, inTa.value);
      showResult(r);
      runBtn.disabled = false;
    }, 30);
  }
  return { el: root, editor: ed, input: inTa, run: run, show: showResult, head: head };
}

/* ---------- exercício ---------- */
function normOut(s){ return String(s).replace(/\r/g, '').replace(/[ \t]+$/gm, '').replace(/\n+$/, ''); }
function createExercise(lesson){
  var ex = lesson.ex;
  var starter = ex.starter || lesson.runs[ex.from].code;
  var sec = h('section', { 'class': 'exercise', 'aria-labelledby': 'ex-' + lesson.slug });
  var html = '<div class="ex-title"><h2 id="ex-' + lesson.slug + '">Exercício</h2>' + tagHTML(ex.tag) + '</div><p>' + ex.prompt + '</p>';
  if (ex.expectShow || ex.tests.length) {
    var t0 = ex.tests[0];
    html += '<div class="expect">' +
      '<div><span class="lbl">Entrada de teste</span><pre>' + (t0.input ? esc(t0.input) : '<span style="color:var(--muted)">(nenhuma)</span>') + '</pre></div>' +
      '<div><span class="lbl">Saída esperada</span><pre>' + esc(normOut(t0.out)) + '</pre></div></div>';
    if (ex.tests.length > 1) html += '<p style="font-size:.95rem;color:var(--muted);margin:6px 0 0">A verificação também roda ' + (ex.tests.length - 1 === 1 ? 'mais um teste' : 'mais ' + (ex.tests.length - 1) + ' testes') + ' com outros valores.</p>';
  }
  sec.innerHTML = html;
  var rn = createRunner({ code: starter, input: ex.tests[0].input, file: ex.file, key: lesson.slug + ':ex' });
  sec.appendChild(rn.el);
  var actions = h('div', { 'class': 'ex-actions' });
  var checkBtn = h('button', { 'class': 'btn-check', type: 'button' }, 'Verificar resposta');
  actions.appendChild(checkBtn);
  sec.appendChild(actions);
  var results = h('div', { 'class': 'results', 'aria-live': 'polite' });
  sec.appendChild(results);
  var det = h('details', { 'class': 'solution' });
  det.innerHTML = '<summary>Ver uma solução</summary><pre>' + highlight(ex.solution) + '</pre>';
  sec.appendChild(det);

  function firstDiff(a, b){
    var al = a.split('\n'), bl = b.split('\n');
    for (var i = 0; i < Math.max(al.length, bl.length); i++) if (al[i] !== bl[i]) return i;
    return -1;
  }
  function markLines(text, idx){
    return text.split('\n').map(function(l, i){ return i === idx ? '<mark>' + esc(l || ' ') + '</mark>' : esc(l); }).join('\n');
  }
  checkBtn.addEventListener('click', function(){
    checkBtn.disabled = true;
    results.innerHTML = '';
    setTimeout(function(){
      var code = rn.editor.value, all = true, htmlR = '', firstRun = null;
      ex.tests.forEach(function(t, i){
        var r = window.CRun.run(code, t.input);
        if (i === 0) firstRun = r;
        var exp = normOut(t.out), got = normOut(r.out);
        var pass = r.ok && exp === got;
        if (!pass) all = false;
        var label = 'Teste ' + (i + 1) + (t.input ? ' (entrada: ' + esc(t.input.replace(/\n/g, ' ')) + ')' : '');
        if (pass) {
          htmlR += '<div class="res-item pass"><b class="st-ok">Passou.</b> ' + label + '</div>';
        } else if (!r.ok) {
          htmlR += '<div class="res-item fail"><b class="st-bad">Erro.</b> ' + label + ': ' + esc(r.err.title) + '. ' + esc(r.err.hint) + '</div>';
        } else {
          var d = firstDiff(exp, got);
          htmlR += '<div class="res-item fail"><b class="st-bad">Saída diferente.</b> ' + label +
            (d >= 0 ? ', a primeira diferença está na linha ' + (d + 1) + ' da saída.' : '') +
            '<div class="res-cmp"><div><span class="lbl">Esperado</span><pre>' + markLines(exp, d) + '</pre></div>' +
            '<div><span class="lbl">Seu programa</span><pre>' + (got ? markLines(got, d) : '<span style="color:var(--muted)">(nada)</span>') + '</pre></div></div></div>';
        }
      });
      if (all) {
        htmlR += '<div class="res-all">Todos os testes passaram. Lição concluída.</div>';
        setDone(lesson.slug, true);
        refreshProgress(lesson.slug);
      }
      results.innerHTML = htmlR;
      if (firstRun) { rn.input.value = ex.tests[0].input; rn.show(firstRun); }
      checkBtn.disabled = false;
    }, 30);
  });
  return sec;
}

    return 0;
}`;
function pgFiles(){ return store.get('pg:files', []) || []; }
function newPgFile(name, code, input){
  var files = pgFiles();
  var base = name.replace(/\.(c|cpp)$/, ''), ext = (name.match(/\.(c|cpp)$/) || ['.c'])[0];
  var nm = name, k = 2;
  while (files.some(function(f){ return f.name === nm; })) nm = base + '_' + (k++) + ext;
  var id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  files.push({ id: id, name: nm });
  store.set('pg:files', files);
  store.set('code:pg:' + id, code);
  if (input) store.set('in:pg:' + id, input);
  store.set('pg:cur', id);
  return id;
}
function renderEditor(){
  document.title = 'Editor livre | Programação para Ciência da Computação';
  menuBtn.hidden = true;
  var files = pgFiles();
  if (!files.length) { newPgFile('main.c', TPL_C, ''); files = pgFiles(); }
  var cur = store.get('pg:cur', files[0].id);
  var f = null;
  files.forEach(function(x){ if (x.id === cur) f = x; });
  if (!f) { f = files[0]; store.set('pg:cur', f.id); }
  var isCpp = /\.cpp$/.test(f.name);
  var list = files.map(function(x){
    return '<li><button type="button" class="pg-file' + (x.id === f.id ? ' on' : '') + '" data-id="' + x.id + '"' + (x.id === f.id ? ' aria-current="true"' : '') + '>' + esc(x.name) + '</button></li>';
  }).join('');
  main.innerHTML = '<div class="wrap pg-wrap"><div class="pg-head"><h1>Editor livre</h1>' +
    '<p>Escreva e execute seus próprios programas em C ou C++, direto no navegador. Os arquivos ficam salvos neste navegador enquanto você não limpar os dados do site.</p></div>' +
    '<div class="pg-layout"><aside class="pg-side" aria-label="Seus arquivos"><ul class="pg-list">' + list + '</ul>' +
    '<div class="pg-new"><button type="button" class="btn-ghost btn-sm" id="pgNewC">Novo arquivo C</button><button type="button" class="btn-ghost btn-sm" id="pgNewCpp">Novo arquivo C++</button></div></aside>' +
    '<section class="pg-main"><div class="pg-bar"><label for="pgName">Nome</label><input id="pgName" value="' + esc(f.name) + '" spellcheck="false" autocomplete="off">' +
    '<span class="spacer"></span><button type="button" class="btn-ghost btn-sm" id="pgCopy">Copiar código</button><button type="button" class="btn-ghost btn-sm" id="pgDel">Excluir</button></div>' +
    '<div id="pgRun"></div><p class="pg-status" id="pgStatus" aria-live="polite"></p></section></div>' + creditHTML() + '</div>';
  var rn = createRunner({ code: isCpp ? TPL_CPP : TPL_C, file: f.name, key: 'pg:' + f.id, noReset: true });
  document.getElementById('pgRun').appendChild(rn.el);
  var status = document.getElementById('pgStatus');
  function say(t){ status.textContent = t; clearTimeout(say.t); say.t = setTimeout(function(){ status.textContent = ''; }, 3500); }
  main.querySelectorAll('.pg-file').forEach(function(b){
    b.addEventListener('click', function(){ store.set('pg:cur', b.getAttribute('data-id')); renderEditor(); });
  });
  document.getElementById('pgNewC').addEventListener('click', function(){ newPgFile('programa.c', TPL_C, ''); renderEditor(); });
  document.getElementById('pgNewCpp').addEventListener('click', function(){ newPgFile('programa.cpp', TPL_CPP, ''); renderEditor(); });
  var nameIn = document.getElementById('pgName');
  nameIn.addEventListener('change', function(){
    var v = nameIn.value.trim().replace(/[\\/:*?"<>|]/g, '');
    if (!v) { nameIn.value = f.name; return; }
    if (!/\.(c|cpp)$/.test(v)) v += isCpp ? '.cpp' : '.c';
    var fs = pgFiles();
    if (fs.some(function(x){ return x.name === v && x.id !== f.id; })) { say('Já existe um arquivo com esse nome.'); nameIn.value = f.name; return; }
    fs.forEach(function(x){ if (x.id === f.id) x.name = v; });
    store.set('pg:files', fs);
    renderEditor();
  });
  document.getElementById('pgCopy').addEventListener('click', function(){
    var code = rn.editor.value;
    function fallback(){
      var t = document.createElement('textarea'); t.value = code; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      say(ok ? 'Código copiado.' : 'Não foi possível copiar. Selecione o código no editor e use Ctrl+C.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function(){ say('Código copiado.'); }, fallback);
    else fallback();
  });
  var delBtn = document.getElementById('pgDel'), armed = false;
  delBtn.addEventListener('click', function(){
    if (!armed) { armed = true; delBtn.textContent = 'Confirmar exclusão'; delBtn.classList.add('danger'); setTimeout(function(){ armed = false; delBtn.textContent = 'Excluir'; delBtn.classList.remove('danger'); }, 4000); return; }
    var fs = pgFiles().filter(function(x){ return x.id !== f.id; });
    store.set('pg:files', fs); store.del('code:pg:' + f.id); store.del('in:pg:' + f.id);
    if (fs.length) store.set('pg:cur', fs[0].id);
    renderEditor();
  });
}

function route(){
  var hsh = location.hash || '#/';
  var m = hsh.match(/^#\/licao\/([\w-]+)/);
  closeMenu();
  if (m) renderLesson(m[1]); else if (/^#\/editor/.test(hsh)) renderEditor(); else renderHome();
  window.scrollTo(0, 0);
  if (location.hash && location.hash !== '#/') main.focus({ preventScroll: true });
}
window.addEventListener('hashchange', route);
route();
})();

</script>
